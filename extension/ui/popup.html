<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1.0">
<title></title>
<link rel=stylesheet href=popup.css>
</head>
<body>
<header class=br-header>
<div class=br-brand>
<img class=br-logo src=../assets/salvage-chrome-icon-128.png alt=Salvage-icon width=28 height=28>
<div class=br-title-wrap>
<h1 class=br-title id=app-title></h1>
</div>
</div>
<div class=br-header-actions>
<button class=br-trash-btn id=trash-btn type=button></button>
<button class=br-backup-btn id=backup-btn type=button></button>
<button class=br-scan-btn id=scan-btn type=button></button>
</div>
</header>
<section class=br-status id=status hidden></section>
<section class=br-linkcheck id=link-check hidden></section>
<section class=br-report id=report hidden></section>
<section class=br-list id=list-panel hidden>
<div class=br-list-head>
<h2 class=br-list-title id=list-title></h2>
<button class=br-close-btn id=list-close type=button></button>
</div>
<p class=br-list-count id=list-count></p>
<div class=br-list-cleanup id=list-cleanup hidden>
<button class=br-cleanup-remove-btn id=cleanup-remove-btn type=button></button>
<span class=br-list-sel id=list-sel role=status aria-live=polite></span>
</div>
<ul class=br-list-items id=list-items></ul>
</section>
<section class=br-trash id=trash-panel hidden>
<div class=br-trash-head>
<h2 class=br-trash-title id=trash-title></h2>
<button class=br-trash-back id=trash-back type=button></button>
</div>
<p class=br-trash-note id=trash-note></p>
<div class=br-trash-actions>
<button class=br-trash-restore-btn id=trash-restore-btn type=button></button>
<button class=br-trash-undo-btn id=trash-undo-btn type=button></button>
<button class=br-trash-purge-btn id=trash-purge-btn type=button></button>
</div>
<ul class=br-trash-items id=trash-items></ul>
</section>
<section class=br-confirm id=confirm-panel hidden>
<div class=br-confirm-box role=alertdialog aria-modal=true aria-labelledby=confirm-title>
<h2 class=br-confirm-title id=confirm-title></h2>
<p class=br-confirm-explain id=confirm-explain></p>
<ul class=br-confirm-items id=confirm-items></ul>
<div class=br-confirm-actions>
<button class=br-confirm-cancel id=confirm-cancel type=button></button>
<button class=br-confirm-ok id=confirm-ok type=button></button>
</div>
</div>
</section>
<section class=br-empty id=empty hidden>
<p id=empty-text></p>
</section>
<footer class=br-footer>
<span id=footer-note></span>
</footer>
<script src=../shared/constants.js></script>
<script src=../shared/normalize.js></script>
<script src=../shared/cleanup.js></script>
<script src=../shared/report.js></script>
<script src=../shared/backup.js></script>
<script src=../shared/link-check-ui.js></script>
<script src=../shared/trash.js></script>
<script src=popup.js></script>
</body>
</html>
